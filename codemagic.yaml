workflows:
  android-mod-menu:
    name: Android Mod Menu Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 11
    scripts:
      - name: Install NDK r21e
        script: |
          echo "Downloading NDK r21e..."
          curl -o $CM_BUILD_DIR/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-darwin-x86_64.zip
          unzip -o $CM_BUILD_DIR/ndk.zip -d $CM_BUILD_DIR
          echo "ndk.dir=$CM_BUILD_DIR/android-ndk-r21e" > "$CM_BUILD_DIR/android/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> "$CM_BUILD_DIR/android/local.properties"
      - name: Build APK
        script: |
          cd $CM_BUILD_DIR
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
