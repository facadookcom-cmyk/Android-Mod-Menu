workflows:
  android-mod-menu:
    name: Android Mod Menu Build
    max_build_duration: 120
    instance_type: linux_x2
    environment:
      java: 11
      ndk: r21e
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
